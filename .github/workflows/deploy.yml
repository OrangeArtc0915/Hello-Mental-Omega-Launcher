name: Deploy to Pages Branch

on:
  push:
    branches: [ Web ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Web

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: pnpm install --no-frozen-lockfile

      - run: pnpm run build

      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: pages
          folder: dist
          clean: true
