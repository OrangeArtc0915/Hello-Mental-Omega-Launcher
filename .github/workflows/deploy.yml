name: Deploy to GitHub Pages

# 站点源码在 Web 分支，构建产物由 Actions 直接发布到 Pages，**不落在任何分支上**。
#
# 前置设置（只需在仓库 Settings 里做一次）：
#   1) Settings → Pages → Source 选「GitHub Actions」
#   2) Settings → Environments → `github-pages` → Deployment branches and tags
#      把 `Web` 加进允许名单（或选 No restriction）。
#      否则会出现：Branch "Web" is not allowed to deploy to github-pages.

on:
  push:
    branches: [ Web ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 连续推送时取消上一次未完成的部署，避免互相覆盖
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # withastro/action 会自动识别 pnpm-lock.yaml、装依赖、执行 `pnpm build`
      # （构建脚本 = astro build + pagefind），并上传 Pages 产物
      - name: Install, build, and upload your site
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
