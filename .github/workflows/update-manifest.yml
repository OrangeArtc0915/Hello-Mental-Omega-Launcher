name: Auto-Update Manifest

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag for testing (e.g. v2.5.1)'
        required: true
        default: 'v2.5.0'

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          VERSION=$(echo "$TAG" | sed 's/^v//')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag=$TAG, version=$VERSION"

      - name: Extract release info
        id: info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          echo "Querying release: $TAG"
          python3 - <<'PYEOF'
          import json, subprocess, os, sys

          result = subprocess.run(
              ['gh', 'release', 'view', os.environ['TAG'], '--json', 'assets,body'],
              capture_output=True, text=True, check=True
          )
          try:
              data = json.loads(result.stdout)
          except json.JSONDecodeError as e:
              print('::error::Failed to parse gh release output', file=sys.stderr)
              print('STDOUT:', result.stdout[:500], file=sys.stderr)
              print('STDERR:', result.stderr[:500], file=sys.stderr)
              sys.exit(1)

          body = data.get('body', '') or ''
          with open('/tmp/release_body.md', 'w', encoding='utf-8') as f:
              f.write(body)

          url = ''
          size = 0
          for a in data.get('assets', []):
              n = a.get('name', '').lower()
              if n.endswith('.exe') and 'wine' not in n:
                  url = a.get('browser_download_url', '')
                  size = a.get('size', 0)
                  break

          if not url:
              print('::error::No HMOL.exe asset found in release ' + os.environ['TAG'], file=sys.stderr)
              print('Available assets:', file=sys.stderr)
              for a in data.get('assets', []):
                  print('  -', a.get('name', ''), file=sys.stderr)
              sys.exit(1)

          date_result = subprocess.run(
              ['date', '-u', '+%Y-%m-%d'],
              capture_output=True, text=True, check=True
          )
          date = date_result.stdout.strip()

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('url=' + url + '\n')
              f.write('size=' + str(size) + '\n')
              f.write('date=' + date + '\n')

          print('Download URL: ' + url)
          print('Asset size:   ' + str(size) + ' bytes')
          print('Release date: ' + date)
          PYEOF

      - name: Download and compute SHA256
        id: hash
        env:
          DOWNLOAD_URL: ${{ steps.info.outputs.url }}
        run: |
          echo "URL from previous step: [$DOWNLOAD_URL]"
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "::error::Download URL is empty - check 'Extract release info' step output"
            exit 1
          fi
          curl -fsSL --retry 3 -o /tmp/HMOL.exe "$DOWNLOAD_URL"
          SHA=$(sha256sum /tmp/HMOL.exe | awk '{print $1}')
          ACTUAL=$(stat -c%s /tmp/HMOL.exe)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "SHA256:  $SHA"
          echo "Size:    $ACTUAL bytes (expected ${{ steps.info.outputs.size }})"
          if [ "$ACTUAL" != "${{ steps.info.outputs.size }}" ]; then
            echo "::warning::Downloaded size differs from release asset size"
          fi

      - name: Update update/HMOL.update.json
        env:
          VERSION: ${{ steps.info.outputs.version }}
          DATE: ${{ steps.info.outputs.date }}
          URL: ${{ steps.info.outputs.url }}
          SIZE: ${{ steps.info.outputs.size }}
          SHA: ${{ steps.hash.outputs.sha }}
        run: |
          python3 << 'PYEOF'
          import json, os, re

          PATH = 'update/HMOL.update.json'
          DEFAULTS = {
              "min_version": "2.5.0",
              "variant": "windows",
              "cleanup": {
                  "reset_config": True,
                  "clear_logs": True,
                  "clear_cache": True,
                  "clear_backups": True
              }
          }

          def parse_v(s):
              nums = re.findall(r'\d+', str(s))
              return tuple(int(n) for n in nums[:3]) if nums else (0, 0, 0)

          def is_major_bump(old_v, new_v):
              return (new_v[0], new_v[1]) > (old_v[0], old_v[1])

          if os.path.exists(PATH):
              with open(PATH, 'r', encoding='utf-8') as f:
                  data = json.load(f)
          else:
              data = {}

          new_v = parse_v(os.environ['VERSION'])
          old_min = parse_v(data.get('min_version', '0.0.0'))

          data['version'] = os.environ['VERSION']
          data['release_date'] = os.environ['DATE']
          data['exe'] = {
              'url': os.environ['URL'],
              'size': int(os.environ['SIZE']),
              'sha256': os.environ['SHA']
          }

          if is_major_bump(old_min, new_v):
              data['mandatory'] = True
              print(f"[auto] Major bump {old_min} -> {new_v}, mandatory=true")
          elif 'mandatory' not in data:
              data['mandatory'] = False

          body = ''
          if os.path.exists('/tmp/release_body.md'):
              with open('/tmp/release_body.md', 'r', encoding='utf-8') as f:
                  body = f.read().strip()
          if body and '<!-- skip-changelog -->' not in body:
              data['changelog_zh'] = body
              print(f"[auto] Changelog updated from release notes ({len(body)} chars)")
          elif '<!-- skip-changelog -->' in body:
              print("[auto] Changelog preserved (<!-- skip-changelog --> marker)")
          else:
              print("[auto] Changelog preserved (release body empty)")

          for k, v in DEFAULTS.items():
              data.setdefault(k, v)

          os.makedirs('update', exist_ok=True)
          with open(PATH, 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write('\n')

          print(f"\n=== {PATH} ===")
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update/HMOL.update.json
          if git diff --staged --quiet; then
            echo "No changes detected, skip commit"
          else
            git commit -m "chore: auto-update manifest to v${{ steps.info.outputs.version }}"
            git push
            echo "Manifest committed and pushed"
            echo ""
            echo "Verify at: https://cdn.jsdelivr.net/gh/${{ github.repository }}@main/update/HMOL.update.json"
          fi
