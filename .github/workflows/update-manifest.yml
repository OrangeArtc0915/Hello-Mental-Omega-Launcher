name: Auto-Update Manifest

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag for testing (e.g. v2.6.2)'
        required: true
        default: 'v2.6.2'

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch first
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure update branch exists on remote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git ls-remote --heads origin update | grep -q update; then
            echo "update branch already exists on remote, checking out..."
            git checkout update
            git pull origin update
          else
            echo "update branch not found, creating from main..."
            git checkout -b update
            git push origin update
            echo "update branch created and pushed"
          fi

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          VERSION=$(echo "$TAG" | sed 's/^v//')
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Using tag=$TAG, version=$VERSION"

      - name: Download all EXE assets and compute SHA256
        id: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          echo "Querying release: $TAG"
          mkdir -p /tmp/assets

          python3 - <<'PYEOF'
          import json, subprocess, os, sys

          result = subprocess.run(
              ['gh', 'release', 'view', os.environ['TAG'], '--json', 'assets,body'],
              capture_output=True, text=True, check=True
          )
          data = json.loads(result.stdout)

          body = data.get('body', '') or ''
          with open('/tmp/release_body.md', 'w', encoding='utf-8') as f:
              f.write(body)

          found = []
          for idx, a in enumerate(data.get('assets', [])):
              name = a.get('name', '')
              n = name.lower().strip()
              if not n.endswith('.exe'):
                  continue
              variant = 'wine' if 'wine' in n else 'windows'
              url = a.get('browserDownloadUrl') or a.get('browser_download_url') or a.get('url') or ''
              size = int(a.get('size', 0) or 0)
              if not url:
                  print(f"[skip] Asset[{idx}]={name!r} no download url", file=sys.stderr)
                  continue
              found.append({'name': name, 'variant': variant, 'url': url, 'size': size})
              print(f"[found] variant={variant} name={name!r} size={size}", file=sys.stderr)

          if not found:
              print('::error::No usable .exe asset in release ' + os.environ['TAG'], file=sys.stderr)
              sys.exit(1)

          date_result = subprocess.run(
              ['date', '-u', '+%Y-%m-%d'],
              capture_output=True, text=True, check=True
          )
          date = date_result.stdout.strip()

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('assets=' + json.dumps(found) + '\n')
              f.write('date=' + date + '\n')

          print('Assets JSON: ' + json.dumps(found))
          print('Date: ' + date)
          PYEOF

      - name: Compute SHA256 for each asset
        env:
          ASSETS_JSON: ${{ steps.assets.outputs.assets }}
        run: |
          set -euo pipefail
          echo "$ASSETS_JSON" > /tmp/assets.json
          python3 - <<'PYEOF'
          import json, subprocess, os
          assets = json.loads(open('/tmp/assets.json').read())
          results = []
          for i, a in enumerate(assets):
              local = f"/tmp/assets/asset_{i}.exe"
              print(f"\n[{a['variant']}] downloading {a['url']}")
              subprocess.run(['curl', '-fsSL', '--retry', '3', '-o', local, a['url']], check=True)
              sha = subprocess.run(['sha256sum', local], capture_output=True, text=True, check=True).stdout.split()[0]
              actual = os.path.getsize(local)
              results.append({
                  'variant': a['variant'],
                  'name': a['name'],
                  'url': a['url'],
                  'size': a['size'],
                  'actual_size': actual,
                  'sha256': sha,
              })
              print(f"[{a['variant']}] sha={sha} size={actual} (expected {a['size']})")
          open('/tmp/asset_results.json', 'w').write(json.dumps(results))
          PYEOF
          cat /tmp/asset_results.json

      - name: Update manifests on update branch
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          DATE: ${{ steps.assets.outputs.date }}
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json, os, re

          RESULTS = json.loads(open('/tmp/asset_results.json').read())
          VERSION = os.environ['VERSION']
          DATE = os.environ['DATE']

          PATHS = {
              'windows': 'update/HMOL.update.json',
              'wine':    'update/HMOL.wine.update.json',
          }
          DEFAULTS = {
              'windows': {
                  "min_version": "2.6.2",
                  "variant": "windows",
              },
              'wine': {
                  "min_version": "2.6.2",
                  "variant": "wine",
              },
          }
          CLEANUP = {
              "reset_config": True,
              "clear_logs": True,
              "clear_cache": True,
              "clear_backups": True,
          }

          def parse_v(s):
              nums = re.findall(r'\d+', str(s))
              return tuple(int(n) for n in nums[:3]) if nums else (0, 0, 0)

          def is_major_bump(old_v, new_v):
              return (new_v[0], new_v[1]) > (old_v[0], old_v[1])

          body = ''
          if os.path.exists('/tmp/release_body.md'):
              body = open('/tmp/release_body.md', encoding='utf-8').read().strip()

          touched = []
          for r in RESULTS:
              variant = r['variant']
              path = PATHS[variant]
              defaults = DEFAULTS[variant]

              if os.path.exists(path):
                  with open(path, 'r', encoding='utf-8') as f:
                      data = json.load(f)
              else:
                  data = {}

              new_v = parse_v(VERSION)
              old_min = parse_v(data.get('min_version', '0.0.0'))

              data['version'] = VERSION
              data['release_date'] = DATE
              data['exe'] = {
                  'url': r['url'],
                  'size': int(r['actual_size']),
                  'sha256': r['sha256'],
              }

              if is_major_bump(old_min, new_v):
                  data['mandatory'] = True
                  print(f"[{variant}] major bump {old_min} -> {new_v}, mandatory=true")
              elif 'mandatory' not in data:
                  data['mandatory'] = False

              if body and '<!-- skip-changelog -->' not in body:
                  data['changelog_zh'] = body
                  print(f"[{variant}] changelog updated ({len(body)} chars)")
              elif '<!-- skip-changelog -->' in body:
                  print(f"[{variant}] changelog preserved (skip marker)")

              for k, v in defaults.items():
                  data.setdefault(k, v)
              data.setdefault('cleanup', CLEANUP)

              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, 'w', encoding='utf-8') as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
                  f.write('\n')

              touched.append(path)
              print(f"\n=== {path} ===")
              print(json.dumps(data, ensure_ascii=False, indent=2))

          open('/tmp/touched.txt', 'w').write('\n'.join(touched))
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TOUCHED=$(cat /tmp/touched.txt)
          if [ -z "$TOUCHED" ]; then
            echo "No manifests touched, nothing to commit"
            exit 0
          fi
          for f in $TOUCHED; do
            git add "$f"
          done
          if git diff --staged --quiet; then
            echo "No changes detected, skip commit"
          else
            git commit -m "chore: auto-update manifest to v${{ steps.tag.outputs.version }}"
            git push origin update
            echo "Manifests committed and pushed to update branch:"
            echo "$TOUCHED" | sed 's/^/  - /'
            echo ""
            echo "Verify at:"
            echo "  https://cdn.jsdelivr.net/gh/${{ github.repository }}@update/update/HMOL.update.json"
            echo "  https://cdn.jsdelivr.net/gh/${{ github.repository }}@update/update/HMOL.wine.update.json"
          fi

      # =============================================
      # Gitee automation (requires GITEE_TOKEN secret)
      # =============================================

      - name: Check Gitee token
        id: gitee_check
        run: |
          if [ -n "${{ secrets.GITEE_TOKEN }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Gitee automation enabled"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Gitee automation skipped (GITEE_TOKEN not set)"
          fi

      - name: Generate Gitee manifests
        if: steps.gitee_check.outputs.enabled == 'true'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          DATE: ${{ steps.assets.outputs.date }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json, os

          VERSION = os.environ['VERSION']
          DATE = os.environ['DATE']
          TAG = os.environ['TAG']
          GITEE_OWNER = "orangearc655743"
          GITEE_REPO = "Hello-Mental-Omega-Launcher"

          RESULTS = json.loads(open('/tmp/asset_results.json').read())
          body = ''
          if os.path.exists('/tmp/release_body.md'):
              body = open('/tmp/release_body.md', encoding='utf-8').read().strip()

          GITEE_PATHS = {
              'windows': 'update/HMOL.gitee.update.json',
              'wine':    'update/HMOL.gitee.wine.update.json',
          }

          for r in RESULTS:
              variant = r['variant']
              path = GITEE_PATHS[variant]
              gitee_url = f"https://gitee.com/{GITEE_OWNER}/{GITEE_REPO}/releases/download/{TAG}/{r['name']}"

              if os.path.exists(path):
                  with open(path, 'r', encoding='utf-8') as f:
                      data = json.load(f)
              else:
                  data = {}

              data['version'] = VERSION
              data['release_date'] = DATE
              data['exe'] = {
                  'url': gitee_url,
                  'size': int(r['actual_size']),
                  'sha256': r['sha256'],
              }
              data.setdefault('min_version', '2.6.2')
              data.setdefault('variant', variant)
              data.setdefault('mandatory', False)
              data.setdefault('cleanup', {
                  "reset_config": True, "clear_logs": True,
                  "clear_cache": True, "clear_backups": True,
              })
              if body and '<!-- skip-changelog -->' not in body:
                  data['changelog_zh'] = body

              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, 'w', encoding='utf-8') as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
                  f.write('\n')
              print(f"[gitee:{variant}] {path} -> {gitee_url}")
              print(json.dumps(data, ensure_ascii=False, indent=2))
          PYEOF

      - name: Commit and push to Gitee update branch
        if: steps.gitee_check.outputs.enabled == 'true'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add update/HMOL.gitee.update.json update/HMOL.gitee.wine.update.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No gitee manifest changes, skip push"
          else
            git commit -m "chore: auto-update gitee manifest to v${{ steps.tag.outputs.version }}"
            GITEE_REMOTE="https://oauth2:${GITEE_TOKEN}@gitee.com/orangearc655743/Hello-Mental-Omega-Launcher.git"
            git push "$GITEE_REMOTE" update
            echo "Gitee manifests pushed to update branch"
          fi

      - name: Create Gitee Release and upload EXE
        if: steps.gitee_check.outputs.enabled == 'true'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json, os, requests, sys

          TOKEN = os.environ['GITEE_TOKEN']
          TAG = os.environ['TAG']
          VERSION = os.environ['VERSION']
          OWNER = "orangearc655743"
          REPO = "Hello-Mental-Omega-Launcher"
          API = "https://gitee.com/api/v5"

          RESULTS = json.loads(open('/tmp/asset_results.json').read())
          body = ''
          if os.path.exists('/tmp/release_body.md'):
              body = open('/tmp/release_body.md', encoding='utf-8').read().strip()
          if not body:
              body = f'HMOL v{VERSION}'

          headers = {"Content-Type": "application/json;charset=UTF-8"}

          # Create release
          print(f"Creating Gitee release {TAG} ...")
          resp = requests.post(
              f"{API}/repos/{OWNER}/{REPO}/releases",
              params={"access_token": TOKEN},
              headers=headers,
              json={
                  "tag_name": TAG,
                  "name": f"HMOL v{VERSION}",
                  "body": body,
                  "target_commitish": "update",
                  "prerelease": False,
              },
              timeout=30,
          )
          if resp.status_code == 409:
              print("Release already exists, fetching existing...")
              resp2 = requests.get(
                  f"{API}/repos/{OWNER}/{REPO}/releases/tags/{TAG}",
                  params={"access_token": TOKEN},
                  headers=headers,
                  timeout=30,
              )
              resp2.raise_for_status()
              release = resp2.json()
          elif resp.status_code >= 400:
              print(f"Create release error {resp.status_code}: {resp.text}", file=sys.stderr)
              resp.raise_for_status()
          else:
              release = resp.json()
              print(f"Release created: id={release.get('id')}")

          release_id = release['id']

          # Upload assets
          for r in RESULTS:
              local_path = f"/tmp/assets/asset_{RESULTS.index(r)}.exe"
              if not os.path.exists(local_path):
                  print(f"Skip: {local_path} not found")
                  continue
              fname = r['name']
              print(f"Uploading {fname} ({r['actual_size']} bytes) ...")
              with open(local_path, 'rb') as fh:
                  upload_resp = requests.post(
                      f"{API}/repos/{OWNER}/{REPO}/releases/{release_id}/attach_files",
                      params={"access_token": TOKEN, "name": fname},
                      files={"file": (fname, fh, "application/octet-stream")},
                      timeout=120,
                  )
              if upload_resp.status_code >= 400:
                  print(f"Upload {fname} error {upload_resp.status_code}: {upload_resp.text}", file=sys.stderr)
              else:
                  print(f"Uploaded {fname} OK")

          print("Gitee release done.")
          PYEOF
